<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>漫画文字编辑器</title>
    <!-- Kuro Manga Studio design system fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- UI fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Geist:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <!-- Comic / handwriting fonts (EN) -->
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Comic+Neue:ital,wght@0,400;0,700;1,400&family=Shantell+Sans:ital,wght@0,400;0,600;1,400&family=Playpen+Sans:wght@400;700&family=Boogaloo&family=Fredoka:wght@400;600&family=Caveat:wght@400;600;700&family=Permanent+Marker&family=Indie+Flower&family=Patrick+Hand&family=Shadows+Into+Light&display=swap" rel="stylesheet" />
    <!-- Comic / handwriting fonts (ZH) -->
    <link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=ZCOOL+QingKe+HuangYou&family=Zhi+Mang+Xing&family=Ma+Shan+Zheng&family=Noto+Sans+SC:wght@400;700;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-screen-web/style.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/cn-fontsource-xiaolai-sc-regular/font.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/cn-fontsource-yozai-regular/font.css" />
  </head>
  <body>
    <div id="app">
      <!-- 顶部工具栏 -->
      <header class="toolbar">
        <div class="toolbar-left">
          <span class="app-logo">🖊</span>
          <h1 class="app-title">漫画文字编辑器</h1>
          <span class="app-badge">v1.0</span>
        </div>

        <div class="toolbar-center">
          <!-- 字体 -->
          <div class="tool-group">
            <label class="tool-label">FONT</label>
            <select id="fontFamily" class="tool-select font-preview-select" style="width: 140px;">
              <optgroup label="── 中文漫画 ──">
                <option value="Noto Sans SC">思源黑体（标准对白）</option>
                <option value="YouYuan, 幼圆, STYuanti-SC-Regular, 华文圆体, Yuanti SC, system-ui">系统圆体（幼圆/华文）</option>
                <option value="LXGW WenKai Screen">霞鹜文楷（经典手写）</option>
                <option value="Xiaolai SC">小赖字体（可爱手写）</option>
                <option value="Yozai">悠哉字体（随性手写）</option>
                <option value="ZCOOL KuaiLe">站酷快乐体（轻松可爱）</option>
                <option value="ZCOOL QingKe HuangYou">站酷黄油体（醒目标题）</option>
                <option value="Zhi Mang Xing">志莽行书（狂放手写）</option>
                <option value="Ma Shan Zheng">马善政毛笔（霸气音效）</option>
              </optgroup>
              <optgroup label="── 英文对白 ──">
                <option value="Comic Neue">Comic Neue（清晰对白）</option>
                <option value="Bangers">Bangers（爆炸音效）</option>
                <option value="Boogaloo">Boogaloo（轻松对话）</option>
                <option value="Fredoka">Fredoka（圆润可爱）</option>
              </optgroup>
              <optgroup label="── 英文手写 ──">
                <option value="Caveat">Caveat（自然手写）</option>
                <option value="Shantell Sans">Shantell Sans（艺术手写）</option>
                <option value="Playpen Sans">Playpen Sans（童趣手写）</option>
                <option value="Indie Flower">Indie Flower（随性手写）</option>
                <option value="Patrick Hand">Patrick Hand（工整手写）</option>
                <option value="Shadows Into Light">Shadows Into Light（轻盈手写）</option>
              </optgroup>
              <optgroup label="── 英文强调 ──">
                <option value="Permanent Marker">Permanent Marker（马克笔）</option>
              </optgroup>
            </select>
          </div>
          <div class="toolbar-divider"></div>
          <!-- 字号 -->
          <div class="tool-group">
            <label class="tool-label">SIZE</label>
            <input type="number" id="fontSize" value="32" min="8" max="200" class="tool-number" />
            <span class="tool-unit">px</span>
          </div>
          <!-- 字重 & 大写 & 效果 -->
          <div class="tool-group">
            <button id="btnBold" class="btn-toggle" title="粗体">B</button>
            <button id="btnUppercase" class="btn-toggle btn-toggle-mono" title="全大写（漫画惯例）">AA</button>
            <div class="toolbar-divider-sm" style="width:1px;height:16px;background:var(--c-outline);margin:0 2px;"></div>
            <button id="btnHighlight" class="btn-toggle" title="荧光笔高亮">
              <span style="background: rgba(255,235,59,0.5); padding: 0 2px; border-radius: 2px;">H</span>
            </button>
            <button id="btnWavy" class="btn-toggle" title="波浪下划线">
              <span style="text-decoration: underline wavy currentColor; text-underline-offset: 2px;">U</span>
            </button>
          </div>
          <div class="toolbar-divider"></div>
          <!-- 文字颜色 -->
          <div class="tool-group">
            <label class="tool-label">COLOR</label>
            <div class="color-swatch-wrap">
              <input type="color" id="fontColor" value="#111111" class="tool-color" />
              <div class="color-preview" id="fontColorPreview"></div>
            </div>
          </div>
          <!-- 描边 -->
          <div class="tool-group">
            <label class="tool-label">STROKE</label>
            <div class="color-swatch-wrap">
              <input type="color" id="strokeColor" value="#ffffff" class="tool-color" />
              <div class="color-preview" id="strokeColorPreview" style="background:#fff"></div>
            </div>
            <input type="number" id="strokeWidth" value="0" min="0" max="20" class="tool-number" style="width:44px" />
            <span class="tool-unit">px</span>
          </div>
          <div class="toolbar-divider"></div>
          <!-- 气泡 -->
          <div class="tool-group">
            <label class="tool-label">BUBBLE</label>
            <select id="bubbleStyle" class="tool-select">
              <option value="none">无气泡</option>
              <option value="speech-right">💬 对话（右尾）</option>
              <option value="speech-left">💬 对话（左尾）</option>
              <option value="thought">💭 思考气泡</option>
              <option value="shout">💥 爆炸气泡</option>
              <option value="rect">⬜ 旁白框</option>
            </select>
          </div>
        </div>

        <div class="toolbar-right">
          <button id="btnChangeImage" class="btn-ghost" title="更换底图而不丢失当前文字">🖼 换图</button>
          <div class="btn-group" style="margin-left: 8px;">
            <button id="btnUndo" class="btn-icon" title="撤销 Ctrl+Z">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M3 7v6h6"/><path d="M3 13a9 9 0 1 0 2.6-6.4L3 10"/></svg>
            </button>
            <button id="btnRedo" class="btn-icon" title="重做 Ctrl+Y">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 7v6h-6"/><path d="M21 13a9 9 0 1 1-2.6-6.4L21 10"/></svg>
            </button>
          </div>
          <button id="btnAddText" class="btn-primary">＋ 添加文字</button>
          <button id="btnExport" class="btn-success">⬇ 导出</button>
          <select id="exportFormat" class="tool-select" style="width:68px">
            <option value="png">PNG</option>
            <option value="jpg">JPG</option>
          </select>
        </div>
      </header>

      <!-- 主体区域 -->
      <main class="main-area">
        <!-- 左侧边栏 -->
        <aside class="sidebar">
          <!-- 隐藏的 file input，由画布区点击触发 -->
          <input type="file" id="fileInput" accept="image/*" hidden />

          <!-- 图层列表 -->
          <div class="panel">
            <div class="panel-header">
              <span class="panel-title">图层列表</span>
              <span class="panel-count" id="layerCount">0</span>
            </div>
            <ul id="layerList" class="layer-list"></ul>
          </div>

          <!-- 操作提示 -->
          <div class="panel">
            <div class="panel-header">
              <span class="panel-title">操作提示</span>
            </div>
            <ul class="tips-list">
              <li><kbd>双击画布</kbd> 添加文字</li>
              <li><kbd>双击气泡</kbd> 编辑文字内容</li>
              <li><kbd>拖动</kbd> 移动气泡位置</li>
              <li><kbd>Ctrl+滚轮</kbd> 缩放视图</li>
              <li><kbd>Delete</kbd> 删除选中</li>
              <li><kbd>Ctrl+Z</kbd> 撤销操作</li>
            </ul>
          </div>
        </aside>

        <!-- 画布区 -->
        <section class="canvas-area" id="canvasArea">
          <div class="canvas-wrapper" id="canvasWrapper">
            <div class="canvas-container" id="canvasContainer">
              <canvas id="mainCanvas"></canvas>
              <div id="textLayer"></div>
            </div>
          </div>

          <!-- 空状态提示 -->
          <div class="canvas-hint" id="canvasHint">
            <div class="canvas-hint-inner">
              <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
              <p>点击或拖拽图片到这里</p>
              <span class="canvas-hint-sub">支持 PNG / JPG / WebP</span>
            </div>
          </div>

          <!-- 底部 HUD -->
          <div class="canvas-hud" id="canvasHud" style="display:none">
            <div class="hud-zoom">
              <button id="btnZoomOut" class="hud-btn">−</button>
              <span id="zoomLabel" class="hud-zoom-label">100%</span>
              <button id="btnZoomIn" class="hud-btn">+</button>
              <button id="btnZoomFit" class="hud-btn hud-btn-text">适应</button>
            </div>
          </div>
        </section>
      </main>

      <!-- 文字编辑弹窗 -->
      <div class="modal-overlay" id="textModal" style="display:none">
        <div class="modal">
          <div class="modal-header">
            <h2 class="modal-title">编辑文字</h2>
            <button class="modal-close" id="btnModalCancel">✕</button>
          </div>
          <textarea id="textInput" class="modal-textarea" placeholder="输入文字内容…" rows="4"></textarea>
          <p class="modal-hint">Ctrl+Enter 确认 · Esc 取消</p>
          <div class="modal-actions">
            <button id="btnModalCancel2" class="btn-ghost">取消</button>
            <button id="btnModalOk" class="btn-primary">确定</button>
          </div>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
