      <!-- 顶部工具栏 -->
      <header class="toolbar">
        <div class="toolbar-left">
          <span class="app-logo"><i data-lucide="pen-tool"></i></span>
          <h1 class="app-title">漫画文字编辑器</h1>
          <span class="app-badge">v2.0</span>
        </div>

        <div class="toolbar-center">
          <!-- 中间空出来，可作为文档标题或居中提示 -->
        </div>

        <div class="toolbar-right">
          <button id="btnReset" class="btn-ghost" title="清空全部内容并重新开始" style="color: #ef4444;">
            <i data-lucide="trash" style="width:16px;height:16px;margin-right:6px;vertical-align:-3px;"></i>清空重做
          </button>
          <button id="btnChangeImage" class="btn-ghost" title="更换底图而不丢失当前文字">
            <i data-lucide="image" style="width:16px;height:16px;margin-right:6px;vertical-align:-3px;"></i>更换底图
          </button>
          <div class="btn-group" style="margin-left: 8px;">
            <button id="btnUndo" class="btn-icon" title="撤销 Ctrl+Z">
              <i data-lucide="undo-2" style="width:16px;height:16px;"></i>
            </button>
            <button id="btnRedo" class="btn-icon" title="重做 Ctrl+Y">
              <i data-lucide="redo-2" style="width:16px;height:16px;"></i>
            </button>
          </div>
          <button id="btnAddText" class="btn-primary">
            <i data-lucide="message-square-plus" style="width:16px;height:16px;margin-right:4px;vertical-align:-3px;"></i>添加文字
          </button>
          <button id="btnExport" class="btn-success">
            <i data-lucide="download" style="width:16px;height:16px;margin-right:4px;vertical-align:-3px;"></i>导出
          </button>
          <select id="exportFormat" class="tool-select" style="width:68px">
            <option value="png">PNG</option>
            <option value="jpg">JPG</option>
          </select>
        </div>
      </header>

      <!-- 主体区域 -->
      <main class="main-area">
        <!-- 左侧边栏 -->
        <aside class="sidebar sidebar-left">
          <input type="file" id="fileInput" accept="image/*" hidden />
          <div class="panel">
            <div class="panel-header">
              <span class="panel-title">图层列表</span>
              <span class="panel-count" id="layerCount">0</span>
            </div>
            <ul id="layerList" class="layer-list"></ul>
          </div>
          <div class="panel">
            <div class="panel-header">
              <span class="panel-title">操作提示</span>
            </div>
            <ul class="tips-list">
              <li><kbd>双击画布</kbd> 添加文字</li>
              <li><kbd>双击气泡</kbd> 编辑文字内容</li>
              <li><kbd>拖动</kbd> 移动气泡位置</li>
              <li><kbd>Ctrl+滚轮</kbd> 缩放视图</li>
              <li><kbd>Delete</kbd> 删除选中</li>
              <li><kbd>Ctrl+Z</kbd> 撤销操作</li>
            </ul>
          </div>
        </aside>

        <!-- 画布区 -->
        <section class="canvas-area" id="canvasArea">
          <div class="canvas-wrapper" id="canvasWrapper">
            <div class="canvas-container" id="canvasContainer">
              <canvas id="mainCanvas"></canvas>
              <div id="textLayer"></div>
            </div>
          </div>
          <div class="canvas-hint" id="canvasHint">
            <div class="canvas-hint-inner">
              <i data-lucide="image-plus" style="width: 48px; height: 48px; margin-bottom: 16px; opacity: 0.8;"></i><br>
              点击或拖拽图片到这里
            </div>
          </div>
          <div class="canvas-hud" id="canvasHud" style="display:none">
            <div class="hud-zoom">
              <button id="btnZoomOut" class="hud-btn">−</button>
              <span id="zoomLabel" class="hud-zoom-label">100%</span>
              <button id="btnZoomIn" class="hud-btn">+</button>
              <button id="btnZoomFit" class="hud-btn hud-btn-text">适应</button>
            </div>
          </div>
        </section>

        <!-- 右侧边栏 (属性面板) -->
        <aside class="sidebar sidebar-right">
          <div class="panel">
            <div class="panel-header">
              <span class="panel-title">文本属性</span>
            </div>
            <div class="prop-content">
              <!-- 字体 -->
              <div class="prop-row">
                <label class="prop-label">字体</label>
                <select id="fontFamily" class="tool-select font-preview-select" style="flex:1;">
                  <optgroup label="── 中文漫画 ──">
                    <option value="Noto Sans SC">思源黑体（标准对白）</option>
                    <option value="YouYuan, 幼圆, STYuanti-SC-Regular, 华文圆体, Yuanti SC, system-ui">系统圆体（幼圆/华文）</option>
                    <option value="LXGW WenKai Screen">霞鹜文楷（经典手写）</option>
                    <option value="Xiaolai SC">小赖字体（可爱手写）</option>
                    <option value="Yozai">悠哉字体（随性手写）</option>
                    <option value="ZCOOL KuaiLe">站酷快乐体（轻松可爱）</option>
                    <option value="ZCOOL QingKe HuangYou">站酷黄油体（醒目标题）</option>
                    <option value="Zhi Mang Xing">志莽行书（狂放手写）</option>
                    <option value="Ma Shan Zheng">马善政毛笔（霸气音效）</option>
                  </optgroup>
                  <optgroup label="── 英文对白 ──">
                    <option value="Comic Neue">Comic Neue（清晰对白）</option>
                    <option value="Bangers">Bangers（爆炸音效）</option>
                    <option value="Boogaloo">Boogaloo（轻松对话）</option>
                    <option value="Fredoka">Fredoka（圆润可爱）</option>
                  </optgroup>
                  <optgroup label="── 英文手写 ──">
                    <option value="Caveat">Caveat（自然手写）</option>
                    <option value="Shantell Sans">Shantell Sans（艺术手写）</option>
                    <option value="Playpen Sans">Playpen Sans（童趣手写）</option>
                    <option value="Indie Flower">Indie Flower（随性手写）</option>
                    <option value="Patrick Hand">Patrick Hand（工整手写）</option>
                    <option value="Shadows Into Light">Shadows Into Light（轻盈手写）</option>
                  </optgroup>
                  <optgroup label="── 英文强调 ──">
                    <option value="Permanent Marker">Permanent Marker（马克笔）</option>
                  </optgroup>
                </select>
              </div>

              <!-- 字号 -->
              <div class="prop-row">
                <label class="prop-label">字号</label>
                <input type="number" id="fontSize" value="32" min="8" max="200" class="tool-number" style="flex:1;" />
                <span class="tool-unit" style="margin-left:8px;">px</span>
              </div>

              <!-- 样式 & 效果 -->
              <div class="prop-row">
                <label class="prop-label">样式</label>
                <div class="tool-group" style="flex:1;">
                  <button id="btnBold" class="btn-toggle" title="粗体"><i data-lucide="bold" style="width:16px;height:16px;"></i></button>
                  <button id="btnUppercase" class="btn-toggle" title="全大写"><i data-lucide="case-upper" style="width:16px;height:16px;"></i></button>
                  <div class="toolbar-divider-sm" style="width:1px;height:16px;background:var(--c-outline);margin:0 2px;"></div>
                  <button id="btnHighlight" class="btn-toggle" title="荧光笔高亮"><i data-lucide="highlighter" style="width:16px;height:16px;"></i></button>
                  <button id="btnWavy" class="btn-toggle" title="波浪下划线"><i data-lucide="underline" style="width:16px;height:16px;"></i></button>
                </div>
              </div>

              <!-- 颜色 -->
              <div class="prop-row">
                <label class="prop-label">颜色</label>
                <div class="color-swatch-wrap" style="flex:1;">
                  <input type="color" id="fontColor" value="#111111" class="tool-color" />
                  <div class="color-preview" id="fontColorPreview"></div>
                </div>
              </div>

              <div class="panel-divider"></div>
              <span class="panel-title" style="margin: 12px 0 8px 0; display: block; font-size: 11px;">描边效果</span>

              <!-- 描边颜色 -->
              <div class="prop-row">
                <label class="prop-label">颜色</label>
                <div class="color-swatch-wrap" style="flex:1;">
                  <input type="color" id="strokeColor" value="#ffffff" class="tool-color" />
                  <div class="color-preview" id="strokeColorPreview" style="background:#fff"></div>
                </div>
              </div>

              <!-- 描边粗细 -->
              <div class="prop-row">
                <label class="prop-label">粗细</label>
                <input type="number" id="strokeWidth" value="0" min="0" max="20" class="tool-number" style="flex:1;" />
                <span class="tool-unit" style="margin-left:8px;">px</span>
              </div>

              <div class="panel-divider"></div>
              <span class="panel-title" style="margin: 12px 0 8px 0; display: block; font-size: 11px;">气泡背景</span>

              <!-- 气泡 -->
              <div class="prop-row">
                <label class="prop-label">形状</label>
                <select id="bubbleStyle" class="tool-select" style="flex:1;">
                  <option value="none">无气泡</option>
                  <option value="speech-right">对话（右尾）</option>
                  <option value="speech-left">对话（左尾）</option>
                  <option value="thought">思考气泡</option>
                  <option value="shout">爆炸气泡</option>
                  <option value="rect">旁白框</option>
                </select>
              </div>

            </div>
          </div>
        </aside>
      </main>
